[package]
name = "abax"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Abax: a soroban (Japanese abacus) trainer"

[lib]
name = "abax"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "abax"
path = "src/main.rs"

[dependencies]
abax-core = { path = "../abax-core" }
egui = "0.36"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
env_logger = "0.11"
directories = "6"
cpal = "0.18"
png = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
android_logger = "0.15"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
